<svg xmlns="http://www.w3.org/2000/svg" viewBox="-260 -180 2150 3000" width="100%" height="100%" font-family="Segoe UI, -apple-system, sans-serif">
  <defs>
    <!-- Маркеры стрелок -->
    <marker id="arrow-start" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M10,1 L2,5 L10,9 L7,5 Z" fill="#d32f2f" />
    </marker>
    <marker id="arrow-end" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 L3,5 Z" fill="#d32f2f" />
    </marker>

    <!-- Штриховки для элементов -->
    <pattern id="hatch-carcass" width="20" height="20" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#b0bec5" stroke-width="2" />
    </pattern>
    <pattern id="hatch-fixed" width="15" height="15" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="15" stroke="#ba68c8" stroke-width="1.5" />
    </pattern>
    <pattern id="hatch-removable" width="12" height="12" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#38bdf8" stroke-width="1.5" />
    </pattern>
    <pattern id="hatch-post" width="15" height="15" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="15" stroke="#81c784" stroke-width="1.5" />
    </pattern>
    <pattern id="hatch-visor" width="15" height="15" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="15" stroke="#ffb74d" stroke-width="2" />
    </pattern>
  </defs>

  <g id="background">
    <rect x="-260" y="-180" width="2150" height="3000" fill="#ffffff" />
  </g>

  <!-- ============================================================== -->
  <!-- ЧЕРТЕЖ ШКАФА (МАСШТАБ 1:1, Y_svg = 2660 - Y_cad)               -->
  <!-- ============================================================== -->
  <g id="cabinet" stroke-linecap="square">

    <!-- СЛОЙ 1: БАЗОВЫЙ КОРПУС ШКАФА -->
    <!-- Левая боковина: X=0..16, Y=0..2660 -->
    <rect x="0" y="0" width="16" height="2660" fill="url(#hatch-carcass)" stroke="#2c3e50" stroke-width="2" />
    <!-- Правая боковина: X=984..1000, Y=0..2660 -->
    <rect x="984" y="0" width="16" height="2660" fill="url(#hatch-carcass)" stroke="#2c3e50" stroke-width="2" />

    <!-- КОЗЫРЕК (65 мм вверху): X=16..984, Y_cad=2595..2660 -> Y_svg=0..65 -->
    <rect x="16" y="0" width="968" height="65" fill="url(#hatch-visor)" stroke="#e65100" stroke-width="2.5" />
    <rect x="16" y="0" width="968" height="65" fill="#fff3e0" opacity="0.6" />
    <text x="500" y="40" font-size="22" fill="#e65100" font-weight="bold" text-anchor="middle">Козырек (фальшпанель) 65 мм</text>

    <!-- Крышка (под козырьком): X=16..984, Y_cad=2579..2595 -> Y_svg=65..81 -->
    <rect x="16" y="65" width="968" height="16" fill="url(#hatch-carcass)" stroke="#2c3e50" stroke-width="2" />

    <!-- Дно: X=16..984, Y_cad=60..76 -> Y_svg=2584..2600 -->
    <rect x="16" y="2584" width="968" height="16" fill="url(#hatch-carcass)" stroke="#2c3e50" stroke-width="2" />

    <!-- Цоколь (60 мм): X=16..984, Y_cad=0..60 -> Y_svg=2600..2660 -->
    <rect x="16" y="2600" width="968" height="60" fill="#eceff1" stroke="#2c3e50" stroke-width="2" />
    <text x="500" y="2636" font-size="20" fill="#546e7a" font-weight="bold" text-anchor="middle">Цоколь 60 мм (стянут евровинтами 7х50)</text>

    <!-- СЛОЙ 2: ВНУТРЕННЕЕ НАПОЛНЕНИЕ -->
    <!-- Антресольная полка: Y_cad=2113..2129 -> Y_svg=531..547 -->
    <rect x="16" y="531" width="968" height="16" fill="url(#hatch-fixed)" stroke="#4a148c" stroke-width="2" />
    <text x="500" y="270" font-size="24" fill="#37474f" font-style="italic" text-anchor="middle">Общая полка (Антресоль)</text>
    <text x="500" y="310" font-size="22" fill="#7b1fa2" font-weight="bold" text-anchor="middle">Проем в свету: 450 мм × 968 мм (глубина 430)</text>

    <!-- Средняя вертикальная стойка: X=368..384, Y_cad=76..2113 -> Y_svg=547..2584 (H=2037) -->
    <rect x="368" y="547" width="16" height="2037" fill="url(#hatch-post)" stroke="#1b5e20" stroke-width="2" />

    <!-- ПРАВАЯ СЕКЦИЯ (Ширина 600 мм: X=384..984) -->
    <!-- Полка правая над штангой: Y_cad=1616..1632 -> Y_svg=1028..1044 -->
    <rect x="384" y="1028" width="600" height="16" fill="url(#hatch-fixed)" stroke="#4a148c" stroke-width="2" />
    <!-- Верхняя ниша справа -->
    <text x="684" y="770" font-size="22" fill="#4a148c" font-weight="bold" text-anchor="middle">Верхняя ниша</text>
    <text x="684" y="805" font-size="18" fill="#7b1fa2" text-anchor="middle">481 мм (в свету)</text>

    <!-- Нижняя ниша справа (под штангу/микролифт 1540 мм) -->
    <circle cx="684" cy="1120" r="16" fill="none" stroke="#c2185b" stroke-width="4" />
    <line x1="664" y1="1120" x2="704" y2="1120" stroke="#c2185b" stroke-width="2" />
    <text x="684" y="1160" font-size="18" fill="#c2185b" font-weight="bold" text-anchor="middle">Штанга (микролифт при D=450)</text>
    <text x="684" y="1800" font-size="22" fill="#2e7d32" font-weight="bold" text-anchor="middle">Платяное отделение</text>
    <text x="684" y="1835" font-size="18" fill="#388e3c" text-anchor="middle">1540 мм (в свету)</text>

    <!-- ЛЕВАЯ СЕКЦИЯ (Ширина 352 мм: X=16..368) -->
    <!-- Полка 1 левая (жесткая над нишей 850): Y_cad=926..942 -> Y_svg=1718..1734 -->
    <rect x="16" y="1718" width="352" height="16" fill="url(#hatch-fixed)" stroke="#4a148c" stroke-width="2" />
    <text x="192" y="2150" font-size="20" fill="#006064" font-weight="bold" text-anchor="middle">Ниша под ящики/белье</text>
    <text x="192" y="2185" font-size="18" fill="#00838f" text-anchor="middle">850 мм (в свету)</text>

    <!-- Съемная полка 2 (голубая): Y_cad=1321..1337 -> Y_svg=1323..1339 -->
    <rect x="16" y="1323" width="352" height="16" fill="url(#hatch-removable)" stroke="#0284c7" stroke-width="2" />
    <text x="192" y="1520" font-size="18" fill="#0284c7" text-anchor="middle">Полка съемная (D=420)</text>
    <text x="192" y="1548" font-size="16" fill="#0369a1" text-anchor="middle">~380 мм (в свету)</text>

    <!-- Съемная полка 3 (голубая): Y_cad=1717..1733 -> Y_svg=927..943 -->
    <rect x="16" y="927" width="352" height="16" fill="url(#hatch-removable)" stroke="#0284c7" stroke-width="2" />
    <text x="192" y="1120" font-size="18" fill="#0284c7" text-anchor="middle">Полка съемная (D=420)</text>
    <text x="192" y="1148" font-size="16" fill="#0369a1" text-anchor="middle">~380 мм (в свету)</text>

    <text x="192" y="720" font-size="18" fill="#0284c7" text-anchor="middle">Верхний отсек</text>
    <text x="192" y="748" font-size="16" fill="#0369a1" text-anchor="middle">~380 мм (в свету)</text>

    <!-- СЛОЙ 3: ОБОЗНАЧЕНИЕ ФУРНИТУРЫ (КРЕПЕЖА) БАЗЫ -->
    <!-- Стяжки Hafele Rafix (VB) на дне -->
    <circle cx="40" cy="2592" r="7" fill="#f59e0b" stroke="#b45309" stroke-width="1.5" />
    <circle cx="960" cy="2592" r="7" fill="#f59e0b" stroke="#b45309" stroke-width="1.5" />
    <!-- Стяжки Hafele Rafix (VB) на крышке -->
    <circle cx="40" cy="73" r="7" fill="#f59e0b" stroke="#b45309" stroke-width="1.5" />
    <circle cx="960" cy="73" r="7" fill="#f59e0b" stroke="#b45309" stroke-width="1.5" />
    <!-- Евровинты на цоколе -->
    <rect x="2" y="2626" width="12" height="8" fill="#475569" />
    <rect x="986" y="2626" width="12" height="8" fill="#475569" />
  </g>

  <!-- ============================================================== -->
  <!-- РАЗМЕРНЫЕ ЛИНИИ (КРАСНЫЕ)                                      -->
  <!-- ============================================================== -->
  <g id="dimensions" stroke="#d32f2f" stroke-width="2" font-size="24" font-weight="bold" fill="#d32f2f">

    <!-- ОБЩАЯ ВЫСОТА ШКАФА: 2660 мм (слева X=-80) -->
    <line x1="-80" y1="0" x2="-80" y2="2660" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <line x1="-95" y1="0" x2="0" y2="0" stroke="#e57373" stroke-width="1.5" />
    <line x1="-95" y1="2660" x2="0" y2="2660" stroke="#e57373" stroke-width="1.5" />
    <g transform="translate(-105, 1330) rotate(-90)">
      <text x="0" y="0" text-anchor="middle">2660 (Общая высота)</text>
    </g>

    <!-- КОЗЫРЕК: 65 мм (справа X=1040) -->
    <line x1="1040" y1="0" x2="1040" y2="65" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <line x1="984" y1="0" x2="1060" y2="0" stroke="#e57373" stroke-width="1.5" />
    <line x1="984" y1="65" x2="1060" y2="65" stroke="#e57373" stroke-width="1.5" />
    <text x="1080" y="42" fill="#e65100" text-anchor="start">65 (Козырек)</text>

    <!-- АНТРЕСОЛЬ: 450 мм в свету (справа X=1040) -->
    <line x1="1040" y1="81" x2="1040" y2="531" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <line x1="984" y1="81" x2="1060" y2="81" stroke="#e57373" stroke-width="1.5" />
    <line x1="984" y1="531" x2="1060" y2="531" stroke="#e57373" stroke-width="1.5" />
    <text x="1080" y="315" fill="#d32f2f" text-anchor="start">450 (в свету)</text>

    <!-- ПРАВАЯ НИША ПОД ШТАНГУ: 1540 мм (внутри секции X=780) -->
    <line x1="780" y1="1044" x2="780" y2="2584" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <line x1="384" y1="1044" x2="800" y2="1044" stroke="#e57373" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="16" y1="2584" x2="800" y2="2584" stroke="#e57373" stroke-width="1" stroke-dasharray="4,4" />
    <g transform="translate(815, 1814) rotate(90)">
      <text x="0" y="0" text-anchor="middle">1540 (в свету)</text>
    </g>

    <!-- ЛЕВАЯ НИША ПОД ЯЩИКИ: 850 мм (внутри секции X=280) -->
    <line x1="280" y1="1734" x2="280" y2="2584" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <line x1="16" y1="1734" x2="300" y2="1734" stroke="#e57373" stroke-width="1" stroke-dasharray="4,4" />
    <g transform="translate(315, 2159) rotate(90)">
      <text x="0" y="0" text-anchor="middle">850 (в свету)</text>
    </g>

    <!-- ЦОКОЛЬ: 60 мм (справа X=1040) -->
    <line x1="1040" y1="2600" x2="1040" y2="2660" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <line x1="984" y1="2600" x2="1060" y2="2600" stroke="#e57373" stroke-width="1.5" />
    <line x1="984" y1="2660" x2="1060" y2="2660" stroke="#e57373" stroke-width="1.5" />
    <text x="1080" y="2638" text-anchor="start">60</text>

    <!-- ПРАВАЯ СЕКЦИЯ: 600 мм (внизу X=384..984) -->
    <line x1="384" y1="2700" x2="984" y2="2700" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <line x1="384" y1="2584" x2="384" y2="2720" stroke="#e57373" stroke-width="1.5" />
    <line x1="984" y1="2584" x2="984" y2="2720" stroke="#e57373" stroke-width="1.5" />
    <text x="684" y="2735" text-anchor="middle">600 (в свету)</text>

    <!-- ЛЕВАЯ СЕКЦИЯ: 352 мм (внизу X=16..368) -->
    <line x1="16" y1="2700" x2="368" y2="2700" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <line x1="16" y1="2584" x2="16" y2="2720" stroke="#e57373" stroke-width="1.5" />
    <line x1="368" y1="2584" x2="368" y2="2720" stroke="#e57373" stroke-width="1.5" />
    <text x="192" y="2735" text-anchor="middle">352 (в свету)</text>

    <!-- ОБЩАЯ ШИРИНА И ГЛУБИНА ШКАФА: 1000 мм (внизу Y=2800) -->
    <line x1="0" y1="2800" x2="1000" y2="2800" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <line x1="0" y1="2660" x2="0" y2="2820" stroke="#e57373" stroke-width="1.5" />
    <line x1="1000" y1="2660" x2="1000" y2="2820" stroke="#e57373" stroke-width="1.5" />
    <text x="500" y="2835" fill="#d32f2f" text-anchor="middle">1000 (Общая ширина) | Глубина D = 450 мм</text>
  </g>

  <!-- ============================================================== -->
  <!-- ИНФОРМАЦИОННАЯ ПАНЕЛЬ И ЛЕГЕНДА                                -->
  <!-- ============================================================== -->
  <g id="info-panel" transform="translate(1260, 40)">
    <rect x="-20" y="-20" width="620" height="2700" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />

    <text x="0" y="35" font-size="28" font-weight="bold" fill="#0f172a">Спецификация шкафа</text>
    <text x="0" y="70" font-size="18" fill="#64748b">По эскизу + База с козырьком и крепежом</text>

    <!-- Блок 1: Габариты изделия -->
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="580" height="190" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <text x="20" y="35" font-size="20" font-weight="bold" fill="#1e293b">1. Общие габариты шкафа</text>
      <text x="20" y="75" font-size="16" fill="#334155">• Высота полная: 2660 мм</text>
      <text x="20" y="105" font-size="16" fill="#334155">• Ширина полная: 1000 мм</text>
      <text x="20" y="135" font-size="16" fill="#334155">• Глубина корпуса: 450 мм</text>
      <text x="20" y="165" font-size="16" fill="#0284c7" font-weight="bold">• Глубина полок: 430 мм (отступ 20 мм спереди)</text>
    </g>

    <!-- Блок 2: Особенности базы и козырька -->
    <g transform="translate(0, 320)">
      <rect x="0" y="0" width="580" height="240" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <text x="20" y="35" font-size="20" font-weight="bold" fill="#e65100">2. Конструктив базы с козырьком</text>
      <text x="20" y="75" font-size="16" fill="#334155">• Козырек (верхняя фальшпанель): высота 65 мм</text>
      <text x="20" y="105" font-size="16" fill="#334155">• Крышка: опущена на 65 мм (под козырек)</text>
      <text x="20" y="135" font-size="16" fill="#334155">• Цоколь: высота 60 мм, стянут евровинтами 7х50</text>
      <text x="20" y="165" font-size="16" fill="#334155">• Дно и крышка: стянуты стяжками Rafix/VB</text>
      <text x="20" y="195" font-size="16" fill="#b45309" font-weight="bold">• Крепеж полностью соответствует вашей базе 1</text>
    </g>

    <!-- Блок 3: Спецификация проемов в свету -->
    <g transform="translate(0, 580)">
      <rect x="0" y="0" width="580" height="340" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <text x="20" y="35" font-size="20" font-weight="bold" fill="#1e293b">3. Чистые проемы в свету</text>
      <text x="20" y="75" font-size="16" fill="#7b1fa2" font-weight="bold">• Антресоль: проем 450 мм (ширина 968 мм)</text>
      <text x="20" y="115" font-size="16" fill="#1b5e20" font-weight="bold">• Правая секция (W = 600 мм):</text>
      <text x="40" y="145" font-size="15" fill="#334155">- Нижняя ниша под штангу: 1540 мм</text>
      <text x="40" y="175" font-size="15" fill="#334155">- Верхняя полка: 481 мм</text>
      <text x="20" y="215" font-size="16" fill="#0284c7" font-weight="bold">• Левая секция (W = 352 мм):</text>
      <text x="40" y="245" font-size="15" fill="#334155">- Нижняя ниша: 850 мм</text>
      <text x="40" y="275" font-size="15" fill="#334155">- 2 съемные полки: 3 ниши по ~380 мм каждая</text>
      <text x="20" y="315" font-size="15" fill="#64748b">Баланс ширины: 16+352+16+600+16 = 1000 мм</text>
    </g>

    <!-- Блок 4: Цветовая легенда (по скиллу) -->
    <g transform="translate(0, 940)">
      <rect x="0" y="0" width="580" height="320" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <text x="20" y="35" font-size="20" font-weight="bold" fill="#1e293b">4. Цветовое кодирование элементов</text>

      <rect x="20" y="60" width="30" height="18" fill="url(#hatch-carcass)" stroke="#2c3e50" stroke-width="1.5" />
      <text x="60" y="75" font-size="16" fill="#334155">Базовый короб (боковины, дно, крышка)</text>

      <rect x="20" y="95" width="30" height="18" fill="url(#hatch-visor)" stroke="#e65100" stroke-width="1.5" />
      <text x="60" y="110" font-size="16" fill="#e65100" font-weight="bold">Козырек (фальшпанель 65 мм)</text>

      <rect x="20" y="130" width="30" height="18" fill="#eceff1" stroke="#2c3e50" stroke-width="1.5" />
      <text x="60" y="145" font-size="16" fill="#334155">Цоколь 60 мм (евровинты 7х50)</text>

      <rect x="20" y="165" width="30" height="18" fill="url(#hatch-post)" stroke="#1b5e20" stroke-width="1.5" />
      <text x="60" y="180" font-size="16" fill="#1b5e20" font-weight="bold">Вертикальная стойка (D=430)</text>

      <rect x="20" y="200" width="30" height="18" fill="url(#hatch-fixed)" stroke="#4a148c" stroke-width="1.5" />
      <text x="60" y="215" font-size="16" fill="#4a148c" font-weight="bold">Жесткие полки / Антресоль (D=430)</text>

      <rect x="20" y="235" width="30" height="18" fill="url(#hatch-removable)" stroke="#0284c7" stroke-width="1.5" />
      <text x="60" y="250" font-size="16" fill="#0284c7" font-weight="bold">Съемные полки (D=420, шаг ~380 мм)</text>

      <circle cx="35" cy="280" r="8" fill="#f59e0b" stroke="#b45309" stroke-width="1.5" />
      <text x="60" y="285" font-size="16" fill="#b45309" font-weight="bold">Стяжки Rafix (VB) / Крепеж базы</text>
    </g>

    <!-- Блок 5: Особенности глубины 450 мм -->
    <g transform="translate(0, 1280)">
      <rect x="0" y="0" width="580" height="180" rx="8" fill="#f0fdf4" stroke="#bbf7d0" />
      <text x="20" y="35" font-size="20" font-weight="bold" fill="#166534">5. Важное при глубине 450 мм</text>
      <text x="20" y="70" font-size="15" fill="#15803d">• Боковины шкафа: глубина 450 мм</text>
      <text x="20" y="95" font-size="15" fill="#15803d">• Полки и перегородка: 430 мм (-20 мм под двери)</text>
      <text x="20" y="120" font-size="15" fill="#15803d">• Съемные полки: 420 мм (-30 мм от переда)</text>
      <text x="20" y="145" font-size="15" fill="#b91c1c" font-weight="bold">• В нишу 1540 мм ставится выдвижной тромбон!</text>
    </g>
  </g>
</svg>